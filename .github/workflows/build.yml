name: Test on Multiple OS

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
        attempt: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install
          npx cypress verify

      - name: Start server
        run: |
          npm run start &  # Ensure this command properly backgrounds the process
          sleep 2  # Give the server some time to initialize

      - name: Wait for the server to be available (Windows)
        if: runner.os == 'Windows'
        run: |
            timeout=60
            elapsed=0
            while (-not (Test-NetConnection -ComputerName localhost -Port 8082).TcpTestSucceeded -and $elapsed -lt $timeout) {
              Write-Host "Waiting for server..."
              Start-Sleep -Seconds 3
              $elapsed += 3
            }
            if ($elapsed -ge $timeout) {
              Write-Host "Server did not start in time. Failing the test."
              exit 1
            }

      - name: Wait for the server to be available (Linux/macOS)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
            timeout=60
            elapsed=0
            while ! nc -z localhost 8082 && [ $elapsed -lt $timeout ]; do
              echo "Waiting for server..."
              sleep 3
              elapsed=$((elapsed + 3))
            done
            if [ $elapsed -ge $timeout ]; then
              echo "Server did not start in time. Failing the test."
              exit 1
            fi

      - name: Testing on OS (${{ matrix.os }}) with Node.js (version ${{ matrix.node-version }}) attempt ${{ matrix.attempt }}
        working-directory: ./cypress-tests
        run: |
          echo "Run attempt: ${{ matrix.attempt }}"
          npx cypress run --config-file cypress.config.js

      - name: Print server logs on failure
        if: failure()
        run: cat logs/server.log || echo "No logs found"
